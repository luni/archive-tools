name: Torrent Compress Recovery Checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'tools/torrent_compress_recovery/**'
      - '.github/workflows/torrent-compress-recovery.yml'
  push:
    paths:
      - 'tools/torrent_compress_recovery/**'
      - '.github/workflows/torrent-compress-recovery.yml'
  workflow_dispatch:

jobs:
  test:
    name: Validate Torrent Compress Recovery
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/torrent_compress_recovery

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-torrent-compress-recovery-${{ hashFiles('tools/torrent_compress_recovery/pyproject.toml', 'tools/torrent_compress_recovery/uv.lock') }}
          restore-keys: uv-cache-torrent-compress-recovery-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install compression tools for test fixtures
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            xz-utils pixz zstd bzip2 pbzip2 gzip pigz
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff (Formatting)
        run: uv run make format

      - name: Run Ruff (Linting)
        run: uv run make check

      - name: Run vulture (Dead Code)
        run: uv run make vulture

      - name: Run xenon (Cyclomatic Complexity)
        run: uv run make xenon

      - name: Run bandit (Security)
        run: uv run make bandit

      - name: Run pyright (Type Checking)
        run: uv run make pyright

      - name: Create test fixtures (V1)
        run: |
          cd tests/fixtures
          ./prepare_real_data.sh

      - name: Create test fixtures (V2)
        run: |
          cd tests/fixtures
          ./prepare_v2_data.sh

      - name: Run tests with coverage
        run: uv run pytest --cov=torrent_compress_recovery --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: tools/torrent_compress_recovery
